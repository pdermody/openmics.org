        request completed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    RateLimited:
      description: Too many registration submissions from this source; retry later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GeocodingRateLimited:
      description: The geocoding provider (or the server-side proxy's shared rate
        limit) rejected the request; back off and retry later, or continue without
        geocoding assist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    GeocodingUnavailable:
      description: Geocoding is not configured on this server (no provider API key set).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Activity:
      type: string
      enum:
        - singing
        - poetry
        - jam
        - trad
        - comedy
        - storytelling
        - other
    ProfileVisibility:
      type: string
      enum:
        - public
        - unlisted
        - private
    OpenMicStatus:
      type: string
      enum:
        - active
        - paused
        - ended
        - draft
    RegistrationMode:
      type: string
      enum:
        - pre_only
        - on_night_only
        - both
        - external
    RegistrationChannel:
      type: string
      enum:
        - organic
        - shared_link
        - email_reminder
        - social_ad
        - poster_qr
        - kiosk
        - prior
    RegistrationVisibility:
      type: string
      enum:
        - pending
        - valid
    MediaType:
      type: string
      enum:
        - photo
        - video
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    HandleConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            holder_type:
              type: string
              enum:
                - profile
                - open_mic
              nullable: true
            holder_id:
              allOf:
                - $ref: "#/components/schemas/Id"
              nullable: true
    Account:
      type: object
      required:
        - id
        - email
        - display_name
        - plan
        - created_at
        - updated_at
      properties:
        id:
          $ref: "#/components/schemas/Id"
        cognito_id:
          type: string
        email:
          type: string
          format: email
        display_name:
          type: string
        city:
          type: string
          nullable: true
        preferred_language:
          type: string
          nullable: true
        current_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        is_platform_admin:
          type: boolean
        plan:
          type: string
          enum:
            - free
            - pro
        referred_by_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        referred_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Profile:
      type: object
      required:
        - id
        - created_by_account_id
        - profile_name
        - visibility
        - current_handle
      properties:
        id:
          $ref: "#/components/schemas/Id"
        created_by_account_id:
          $ref: "#/components/schemas/Id"
        current_handle:
          type: string
        profile_name:
          type: string
        profile_kind:
          type: string
          enum:
            - organizer
            - performer
        bio:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
          description: Private contact phone for the profile owner and permitted organizers; never shown in public profile reads.
        profile_image_url:
          type: string
          format: uri
          nullable: true
        theme_name:
          type: string
          nullable: true
        color_mode:
          type: string
          enum:
            - light
            - dark
          nullable: true
        visibility:
          $ref: "#/components/schemas/ProfileVisibility"
        links:
          type: array
          items:
            $ref: "#/components/schemas/ProfileLink"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        deleted_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        recovery_deadline:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
    ProfileLink:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        profile_id:
          $ref: "#/components/schemas/Id"
        type:
          type: string
          enum:
            - website
            - instagram
            - youtube
            - tiktok
            - twitter
            - facebook
            - spotify
            - bandcamp
            - email
            - phone
            - other
        url:
          type: string
        label:
          type: string
          nullable: true
        sequence:
          type: integer
    OpenMic:
      type: object
      required:
        - id
        - current_handle
        - name
        - status
      properties:
        id:
          $ref: "#/components/schemas/Id"
        public_code:
          type: string
          pattern: "^[A-Z0-9]{10}$"
          description: Short stable public identifier for URLs. The UUID id remains the internal identifier.
        owner_profile_id:
          $ref: "#/components/schemas/Id"
        current_handle:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        tags:
          type: array
          items:
            type: string
        venue_name:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        city:
          type: string
        country:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        lng:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        time_zone:
          type: string
          example: Europe/Dublin
        schedule_summary:
          type: string
          nullable: true
        schedule_details:
          type: string
          nullable: true
        website:
          type: string
          format: uri
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        originals_only:
          type: boolean
        amplification_available:
          type: boolean
        age_policy:
          type: string
          enum:
            - adults_only
            - children_only
            - both
        registration_mode:
          $ref: "#/components/schemas/RegistrationMode"
        external_registration_url:
          type: string
          format: uri
          nullable: true
        entry_fee_amount:
          type: number
          nullable: true
        entry_fee_currency:
          type: string
          nullable: true
        entry_fee_note:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/OpenMicStatus"
        rating_avg:
          type: number
          minimum: 0
          maximum: 5
        rating_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Event:
      type: object
      required:
        - id
        - open_mic_id
        - title
        - starts_at
        - time_zone
      properties:
        id:
          $ref: "#/components/schemas/Id"
        public_code:
          type: string
          pattern: "^[A-Z0-9]{10}$"
          description: Short stable public identifier for URLs. The UUID id remains the internal identifier.
        open_mic_id:
          $ref: "#/components/schemas/Id"
        title:
          type: string
        starts_at:
          $ref: "#/components/schemas/Timestamp"
        ends_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        time_zone:
          type: string
          example: Europe/Dublin
        running:
          type: boolean
          nullable: true
          description: Null/unset before the organizer has ever started the event, true while
            it is running, false once the organizer has stopped it. Transitioning this from
            true (or unset) to false via PATCH automatically marks every performance still in
            "registered" status as "no_show"; restarting the event (setting it back to true)
            does not reverse that no-show transition or reopen registrations.
        registrations_closed_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        venue_name:
          type: string
        address_line1:
          type: string
        address_line2:
          type: string
          nullable: true
        postcode:
          type: string
          nullable: true
        city:
          type: string
        country:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
          nullable: true
        lng:
          type: number
          minimum: -180
          maximum: 180
          nullable: true
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        tags:
          type: array
          items:
            type: string
        capacity:
          type: integer
          minimum: 1
          nullable: true
        notes:
          type: string
          nullable: true
        rating_avg:
          type: number
          minimum: 0
          maximum: 5
          nullable: true
        rating_count:
          type: integer
          minimum: 0
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
    Registration:
      type: object
      required:
        - id
        - event_id
        - performer_name
        - submission_channel
        - organizer_supervised
        - visibility_state
      properties:
        id:
          $ref: "#/components/schemas/Id"
        event_id:
          $ref: "#/components/schemas/Id"
        profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        performer_name:
          type: string
        performer_city:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        song_names:
          type: array
          items:
            type: string
        submission_channel:
          $ref: "#/components/schemas/RegistrationChannel"
        organizer_supervised:
          type: boolean
        referred_by_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        media_consent:
          type: boolean
        media_consent_updated_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
          description: Set whenever media_consent changes. Revocation only blocks future
            media publication under this registration; media already published
            beforehand is not retroactively removed.
        email_verified_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        verification_method:
          type: string
          enum:
            - email
            - organizer_kiosk
            - authenticated_account
          nullable: true
        visibility_state:
          $ref: "#/components/schemas/RegistrationVisibility"
        claimed_by_account_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        claimed_at:
          allOf:
            - $ref: "#/components/schemas/Timestamp"
          nullable: true
        created_at:
          $ref: "#/components/schemas/Timestamp"
        updated_at:
          $ref: "#/components/schemas/Timestamp"
        adopted_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
          description: Profile explicitly adopted by the claiming account as the public
            attribution for this registration. Distinct from profile_id (set
            only for authenticated self-serve registrations) and never set
            without claimed_by_account_id.
        performances:
          type: array
          items:
            $ref: "#/components/schemas/Performance"
          description: Populated only by the organizer roster listing
            (GET /events/{id}/registrations); omitted from every other
            Registration response.
    Performance:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        registration_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        activity:
          $ref: "#/components/schemas/Activity"
        sequence:
          type: integer
          minimum: 1
        status:
          type: string
          description: >-
            Lifecycle: registered -> present (checked in at the door) -> scheduled (agreed to go
            next) -> performing (on stage) -> performed. no_show/cancelled are manual overrides
            available from any state. A performer doing a second set gets a brand-new performance
            row rather than looping this one back to an earlier state.
          enum:
            - registered
            - present
            - scheduled
            - performing
            - performed
            - no_show
            - cancelled
        checked_in_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically (server clock) the moment status first becomes `present`.
        scheduled_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically (server clock) the moment status first becomes `scheduled`.
        started_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically (server clock) the moment status first becomes `performing`.
        finished_at:
          type: string
          format: date-time
          nullable: true
          description: Set automatically (server clock) the moment status first becomes `performed`.
        notes:
          type: string
          nullable: true
    Media:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/Id"
        media_type:
          $ref: "#/components/schemas/MediaType"
        event_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        profile_owner_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        added_by_profile_id:
          $ref: "#/components/schemas/Id"
        added_by_role:
          type: string
          enum:
            - performer
            - organizer
        source_url:
          type: string
          format: uri
          description: For media_type=photo, an object URL in the platform's own S3 media
            bucket (via the upload-url flow). For media_type=video, a link on an
            allowlisted host (youtube.com, youtu.be, or vimeo.com). Enforced
            server-side; arbitrary hosts are rejected.
        mime_type:
          type: string
          nullable: true
        size_bytes:
          type: integer
          nullable: true
        caption:
          type: string
          nullable: true
        thumbnail_url:
          type: string
          format: uri
          nullable: true
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Handle:
      type: object
      properties:
        handle:
          type: string
        entity_type:
          type: string
          enum:
            - profile
            - open_mic
          nullable: true
