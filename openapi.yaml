    Id:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    Activity:
      type: string
      enum:
        - singing
        - poetry
        - jam
        - trad
        - comedy
        - storytelling
        - other
    ProfileVisibility:
      type: string
      enum:
        - public
        - unlisted
        - private
    OpenMicStatus:
      type: string
      enum:
        - active
        - paused
        - ended
        - draft
    RegistrationMode:
      type: string
      enum:
        - pre_only
        - on_night_only
        - both
        - external
    RegistrationChannel:
      type: string
      enum:
        - organic
        - shared_link
        - email_reminder
        - social_ad
        - poster_qr
        - kiosk
        - prior
    RegistrationVisibility:
      type: string
      enum:
        - pending
        - valid
    MediaType:
      type: string
      enum:
        - photo
        - video
