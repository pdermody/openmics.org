      oneOf:
        - $ref: "#/components/schemas/PhotoMediaCreateRequest"
        - $ref: "#/components/schemas/VideoMediaCreateRequest"
      discriminator:
        propertyName: media_type
        mapping:
          photo: "#/components/schemas/PhotoMediaCreateRequest"
          video: "#/components/schemas/VideoMediaCreateRequest"
    PhotoMediaCreateRequest:
      type: object
      required:
        - media_type
        - object_key
      properties:
        media_type:
          type: string
          enum:
            - photo
        object_key:
          type: string
          description: Server-generated object key returned by POST /media/upload-url (a
            `tmp/{accountId}/{uuid}.{ext}` key). The server validates the object, moves
            it to its canonical `original/{mediaId}.{ext}` location, and composes
            `source_url` from the plan-bound media bucket. Client-supplied source URLs
            are not accepted for photos.
        caption:
          type: string
          maxLength: 500
        event_id:
          $ref: "#/components/schemas/Id"
        open_mic_id:
          $ref: "#/components/schemas/Id"
        registration_id:
          $ref: "#/components/schemas/Id"
    VideoMediaCreateRequest:
      type: object
      required:
        - media_type
        - video_url
      properties:
        media_type:
          type: string
          enum:
            - video
        video_url:
          type: string
          format: uri
          description: Link on an allowlisted host (youtube.com, youtu.be, or
            vimeo.com). The server extracts `video_platform` and `platform_video_id` and
            composes `source_url` plus the provider thumbnail; arbitrary hosts are
            rejected with `MEDIA_SOURCE_POLICY`.
        caption:
          type: string
          maxLength: 500
        event_id:
          $ref: "#/components/schemas/Id"
        open_mic_id:
          $ref: "#/components/schemas/Id"
        registration_id:
          $ref: "#/components/schemas/Id"
    MediaUpdateRequest:
      type: object
      description: Partial update. `media_type` and the media source are immutable and
        are not accepted here.
      properties:
        caption:
          type: string
          nullable: true
          maxLength: 500
          description: May contain `{performer_name}`, `{performer_city}`,
            `{event_name}`, `{event_date}` tokens, substituted server-side for display,
            alt text, and OG output.
        registration_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
          description: Changes or removes performer attribution. The registration must belong to the media's event and have media consent.
    FeaturedMediaUpdateRequest:
      type: object
      required:
        - media_ids
      properties:
        media_ids:
          type: array
          items:
            $ref: "#/components/schemas/Id"
          description: Ordered replacement list. Every id must reference visible media
            scoped to this series or one of its events; hidden, soft-deleted, or
            consent-revoked media is rejected with `MEDIA_FEATURED_INVALID`.
    UploadUrlRequest:
      type: object
      required:
        - media_type
        - mime_type
      properties:
        media_type:
          $ref: "#/components/schemas/MediaType"
        mime_type:
          type: string
        size_bytes:
          type: integer
    HandleReservationRequest:
      type: object
      required:
        - handle
        - category
        - reason
      properties:
        handle:
          type: string
        category:
          type: string
        reason:
          type: string
