openapi: 3.0.3
info:
  title: Open Mic API
  version: 1.0.0
  description: Canonical API contract. All paths are relative to the /api base URL.
servers:
  - url: https://api.openmics.org/api
    description: Production

tags:
  - name: Auth
  - name: Accounts
  - name: Profiles
  - name: Handles
  - name: Open Mics
  - name: Events
  - name: Registrations
  - name: Performances
  - name: Media
  - name: Reviews
  - name: Comments
  - name: Messages
  - name: Suggestions
  - name: Notifications
  - name: Admin

paths:
  /openapi.json:
    get:
      tags: [Auth]
      operationId: getOpenApiDocument
      summary: Get the canonical OpenAPI document
      responses:
        "200":
          description: OpenAPI document
          content: { application/json: { schema: { type: object } } }
  /auth/sign-up:
    post:
      tags: [Auth]
      operationId: signUp
      requestBody: { $ref: "#/components/requestBodies/SignUp" }
      responses:
        {
          "202": { $ref: "#/components/responses/AccountResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
        }
  /auth/sign-in:
    post:
      tags: [Auth]
      operationId: signIn
      requestBody: { $ref: "#/components/requestBodies/SignIn" }
      responses:
        {
          "200": { $ref: "#/components/responses/AccountResponse" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }
  /auth/refresh-token:
    post:
      tags: [Auth]
      operationId: refreshToken
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses: { "200": { $ref: "#/components/responses/TokenResponse" } }
  /auth/profile:
    get:
      tags: [Auth]
      operationId: getAuthProfile
      security: [{ bearerAuth: [] }]
      responses:
        {
          "200": { $ref: "#/components/responses/AccountResponse" },
          "401": { $ref: "#/components/responses/Unauthorized" },
        }

  /me:
    get:
      tags: [Accounts]
      operationId: getMe
      security: [{ bearerAuth: [] }]
      responses: { "200": { $ref: "#/components/responses/AccountResponse" } }
  /me/permissions:
    get:
      tags: [Accounts]
      operationId: getMyPermissions
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/ProfileQuery" }]
      responses:
        { "200": { $ref: "#/components/responses/PermissionResponse" } }
  /accounts/{id}:
    put:
      tags: [Accounts]
      operationId: updateAccount
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/AccountUpdate" }
      responses:
        {
          "200": { $ref: "#/components/responses/AccountResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /accounts/{id}/profiles:
    get:
      tags: [Accounts]
      operationId: listAccountProfiles
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/ProfileListResponse" } }
  /accounts/{id}/current-profile:
    put:
      tags: [Accounts]
      operationId: setCurrentProfile
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/CurrentProfile" }
      responses: { "200": { $ref: "#/components/responses/ProfileResponse" } }
  /me/claimable-registrations:
    get:
      tags: [Registrations]
      operationId: listClaimableRegistrations
      security: [{ bearerAuth: [] }]
      responses:
        { "200": { $ref: "#/components/responses/RegistrationListResponse" } }
  /me/following/upcoming-events:
    get:
      tags: [Profiles]
      operationId: listFollowedUpcomingEvents
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Limit" },
          { $ref: "#/components/parameters/From" },
          { $ref: "#/components/parameters/To" },
        ]
      responses: { "200": { $ref: "#/components/responses/EventListResponse" } }
  /me/home/upcoming-events:
    get:
      tags: [Events]
      operationId: listPersonalUpcomingEvents
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Near" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses: { "200": { $ref: "#/components/responses/EventListResponse" } }
  /me/home/notable-open-mics:
    get:
      tags: [Open Mics]
      operationId: listPersonalNotableOpenMics
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Near" },
          { $ref: "#/components/parameters/Limit" },
        ]
      responses:
        { "200": { $ref: "#/components/responses/OpenMicListResponse" } }

  /profiles:
    get:
      tags: [Profiles]
      operationId: listProfiles
      parameters:
        [
          { $ref: "#/components/parameters/Page" },
          { $ref: "#/components/parameters/PageSize" },
        ]
      responses:
        { "200": { $ref: "#/components/responses/ProfileListResponse" } }
    post:
      tags: [Profiles]
      operationId: createProfile
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProfileCreate" }
      responses:
        {
          "201": { $ref: "#/components/responses/ProfileResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
          "409": { $ref: "#/components/responses/HandleConflict" },
        }
  /profiles/slug-available:
    get:
      tags: [Profiles]
      operationId: checkProfileSlug
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        { "200": { $ref: "#/components/responses/AvailabilityResponse" } }
  /profiles/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles]
      operationId: getProfile
      responses:
        {
          "200": { $ref: "#/components/responses/ProfileResponse" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    put:
      tags: [Profiles]
      operationId: updateProfile
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ProfileUpdate" }
      responses:
        {
          "200": { $ref: "#/components/responses/ProfileResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
    delete:
      tags: [Profiles]
      operationId: deleteProfile
      security: [{ bearerAuth: [] }]
      responses:
        {
          "204": { description: Profile soft-deleted },
          "403": { $ref: "#/components/responses/Forbidden" },
        }
  /profiles/{id}/follow:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      tags: [Profiles]
      operationId: followProfile
      security: [{ bearerAuth: [] }]
      responses: { "201": { $ref: "#/components/responses/FollowResponse" } }
    delete:
      tags: [Profiles]
      operationId: unfollowProfile
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Unfollowed } }
  /profiles/{id}/followers:
    get:
      tags: [Profiles]
      operationId: listProfileFollowers
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/Page" },
          { $ref: "#/components/parameters/PageSize" },
        ]
      responses:
        { "200": { $ref: "#/components/responses/ProfileListResponse" } }
  /profiles/{id}/following:
    get:
      tags: [Profiles]
      operationId: listProfileFollowing
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/Page" },
          { $ref: "#/components/parameters/PageSize" },
        ]
      responses:
        { "200": { $ref: "#/components/responses/ProfileListResponse" } }
  /profiles/{id}/roles:
    get:
      tags: [Profiles]
      operationId: getProfileRoles
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/RoleListResponse" } }
  /profiles/{id}/members:
    get:
      tags: [Profiles]
      operationId: listProfileMembers
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/RoleAssignmentListResponse" } }
  /profiles/{id}/invitations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Profiles]
      operationId: listProfileInvitations
      security: [{ bearerAuth: [] }]
      responses:
        { "200": { $ref: "#/components/responses/InvitationListResponse" } }
    post:
      tags: [Profiles]
      operationId: inviteProfileMember
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/InvitationCreate" }
      responses:
        { "201": { $ref: "#/components/responses/InvitationResponse" } }
  /profiles/{id}/members/{accountId}:
    delete:
      tags: [Profiles]
      operationId: removeProfileMember
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/AccountId" },
        ]
      responses: { "204": { description: Member removed } }
  /profiles/{id}/members/{accountId}/role:
    put:
      tags: [Profiles]
      operationId: changeProfileMemberRole
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/AccountId" },
        ]
      requestBody: { $ref: "#/components/requestBodies/RoleAssignment" }
      responses:
        { "200": { $ref: "#/components/responses/RoleAssignmentResponse" } }
  /invitations/{id}:
    put:
      tags: [Profiles]
      operationId: respondToInvitation
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/InvitationResponse" }
      responses:
        { "200": { $ref: "#/components/responses/InvitationResponse" } }
  /profiles/{id}/media:
    get:
      tags: [Media]
      operationId: listProfileMedia
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/MediaListResponse" } }
    post:
      tags: [Media]
      operationId: addProfileMedia
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/MediaCreate" }
      responses: { "201": { $ref: "#/components/responses/MediaResponse" } }

  /handles/check/{candidate}:
    get:
      tags: [Handles]
      operationId: checkHandleAvailability
      parameters: [{ $ref: "#/components/parameters/Candidate" }]
      responses:
        {
          "200": { $ref: "#/components/responses/AvailabilityResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
        }

  /open-mics:
    get:
      tags: [Open Mics]
      operationId: listOpenMics
      parameters:
        - { $ref: "#/components/parameters/Q" }
        - { $ref: "#/components/parameters/Country" }
        - { $ref: "#/components/parameters/City" }
        - { $ref: "#/components/parameters/Activity" }
        - { $ref: "#/components/parameters/Tag" }
        - { $ref: "#/components/parameters/Near" }
        - { $ref: "#/components/parameters/Radius" }
        - { $ref: "#/components/parameters/MinRating" }
        - { $ref: "#/components/parameters/RegistrationMode" }
        - { $ref: "#/components/parameters/Sort" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        { "200": { $ref: "#/components/responses/OpenMicListResponse" } }
    post:
      tags: [Open Mics]
      operationId: createOpenMic
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/OpenMicCreate" }
      responses:
        {
          "201": { $ref: "#/components/responses/OpenMicResponse" },
          "409": { $ref: "#/components/responses/HandleConflict" },
        }
  /open-mics/map:
    get:
      tags: [Open Mics]
      operationId: mapOpenMics
      parameters:
        [
          { $ref: "#/components/parameters/Bbox" },
          { $ref: "#/components/parameters/Zoom" },
          { $ref: "#/components/parameters/Activity" },
          { $ref: "#/components/parameters/Tag" },
          { $ref: "#/components/parameters/MinRating" },
        ]
      responses: { "200": { $ref: "#/components/responses/MapResponse" } }
  /open-mics/slug-available:
    get:
      tags: [Open Mics]
      operationId: checkOpenMicSlug
      parameters: [{ $ref: "#/components/parameters/Slug" }]
      responses:
        { "200": { $ref: "#/components/responses/AvailabilityResponse" } }
  /open-mics/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Open Mics]
      operationId: getOpenMic
      responses:
        {
          "200": { $ref: "#/components/responses/OpenMicResponse" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
    put:
      tags: [Open Mics]
      operationId: updateOpenMic
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/OpenMicUpdate" }
      responses: { "200": { $ref: "#/components/responses/OpenMicResponse" } }
    delete:
      tags: [Open Mics]
      operationId: deleteOpenMic
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Open mic soft-deleted } }
  /open-mics/{id}/events:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Events]
      operationId: listOpenMicEvents
      responses: { "200": { $ref: "#/components/responses/EventListResponse" } }
    post:
      tags: [Events]
      operationId: createEvent
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/EventCreate" }
      responses: { "201": { $ref: "#/components/responses/EventResponse" } }
  /open-mics/{id}/next-event:
    get:
      tags: [Events]
      operationId: getNextEvent
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        {
          "200": { $ref: "#/components/responses/EventResponse" },
          "404": { $ref: "#/components/responses/NotFound" },
        }
  /open-mics/{id}/events/slug-available:
    get:
      tags: [Events]
      operationId: checkEventSlug
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/Slug" },
        ]
      responses:
        { "200": { $ref: "#/components/responses/AvailabilityResponse" } }
  /open-mics/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: listOpenMicReviews
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/ReviewListResponse" } }
    post:
      tags: [Reviews]
      operationId: createOpenMicReview
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/ReviewCreate" }
      responses: { "201": { $ref: "#/components/responses/ReviewResponse" } }

  /events/upcoming:
    get:
      tags: [Events]
      operationId: listUpcomingEvents
      parameters:
        [
          { $ref: "#/components/parameters/Near" },
          { $ref: "#/components/parameters/Radius" },
          { $ref: "#/components/parameters/Limit" },
          { $ref: "#/components/parameters/From" },
          { $ref: "#/components/parameters/To" },
        ]
      responses: { "200": { $ref: "#/components/responses/EventListResponse" } }
  /events/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Events]
      operationId: getEvent
      responses: { "200": { $ref: "#/components/responses/EventResponse" } }
    put:
      tags: [Events]
      operationId: updateEvent
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/EventUpdate" }
      responses: { "200": { $ref: "#/components/responses/EventResponse" } }
    delete:
      tags: [Events]
      operationId: deleteEvent
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Event soft-deleted } }
  /events/{id}/registrations:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Registrations]
      operationId: listEventRegistrations
      security: [{ bearerAuth: [] }]
      responses:
        { "200": { $ref: "#/components/responses/RegistrationListResponse" } }
    post:
      tags: [Registrations]
      operationId: createRegistration
      requestBody: { $ref: "#/components/requestBodies/RegistrationCreate" }
      responses:
        {
          "201": { $ref: "#/components/responses/RegistrationResponse" },
          "409": { $ref: "#/components/responses/CapacityError" },
        }
  /events/{id}/media:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Media]
      operationId: listEventMedia
      parameters:
        [
          {
            name: grouped_by,
            in: query,
            schema: { type: string, enum: [added_by_role] },
          },
        ]
      responses: { "200": { $ref: "#/components/responses/MediaListResponse" } }
    post:
      tags: [Media]
      operationId: addEventMedia
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/MediaCreate" }
      responses: { "201": { $ref: "#/components/responses/MediaResponse" } }
  /events/{id}/reviews:
    get:
      tags: [Reviews]
      operationId: listEventReviews
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/ReviewListResponse" } }
    post:
      tags: [Reviews]
      operationId: createEventReview
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/ReviewCreate" }
      responses: { "201": { $ref: "#/components/responses/ReviewResponse" } }
  /events/{id}/reviews/{reviewId}:
    parameters:
      [
        { $ref: "#/components/parameters/Id" },
        { $ref: "#/components/parameters/ReviewId" },
      ]
    get:
      tags: [Reviews]
      operationId: getEventReview
      responses: { "200": { $ref: "#/components/responses/ReviewResponse" } }
    put:
      tags: [Reviews]
      operationId: updateEventReview
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/ReviewUpdate" }
      responses: { "200": { $ref: "#/components/responses/ReviewResponse" } }
    delete:
      tags: [Reviews]
      operationId: deleteEventReview
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Review deleted } }
  /events/{id}/reviews/{reviewId}/responses:
    post:
      tags: [Reviews]
      operationId: respondToEventReview
      security: [{ bearerAuth: [] }]
      parameters:
        [
          { $ref: "#/components/parameters/Id" },
          { $ref: "#/components/parameters/ReviewId" },
        ]
      requestBody: { $ref: "#/components/requestBodies/ReviewResponseCreate" }
      responses: { "201": { $ref: "#/components/responses/ReviewResponse" } }

  /registrations/edit:
    get:
      tags: [Registrations]
      operationId: resolveRegistrationEditLink
      parameters:
        [{ name: token, in: query, required: true, schema: { type: string } }]
      responses:
        "200":
          description: Registration and short-lived edit session established
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite=Lax edit-session cookie; raw token is not retained.
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: no-store }
            Referrer-Policy:
              schema: { type: string, example: no-referrer }
          content:
            {
              application/json:
                { schema: { $ref: "#/components/schemas/Registration" } },
            }
        "404": { $ref: "#/components/responses/NotFound" }
  /registrations/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Registrations]
      operationId: getRegistration
      security: [{ bearerAuth: [] }, { editSession: [] }]
      responses:
        { "200": { $ref: "#/components/responses/RegistrationResponse" } }
    put:
      tags: [Registrations]
      operationId: updateRegistration
      security: [{ bearerAuth: [] }, { editSession: [] }]
      requestBody: { $ref: "#/components/requestBodies/RegistrationUpdate" }
      responses:
        { "200": { $ref: "#/components/responses/RegistrationResponse" } }
  /registrations/{id}/rotate-edit-token:
    post:
      tags: [Registrations]
      operationId: rotateRegistrationEditToken
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/RegistrationResponse" } }
  /registrations/{id}/verify-email:
    post:
      tags: [Registrations]
      operationId: verifyRegistrationEmail
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/EmailVerification" }
      responses:
        {
          "200": { $ref: "#/components/responses/RegistrationResponse" },
          "400": { $ref: "#/components/responses/ValidationError" },
        }
  /registrations/{id}/claim:
    post:
      tags: [Registrations]
      operationId: claimRegistration
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { $ref: "#/components/requestBodies/RegistrationClaim" }
      responses:
        { "200": { $ref: "#/components/responses/RegistrationResponse" } }
  /registrations/{id}/performances:
    get:
      tags: [Performances]
      operationId: listRegistrationPerformances
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        { "200": { $ref: "#/components/responses/PerformanceListResponse" } }

  /performances:
    post:
      tags: [Performances]
      operationId: createPerformance
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/PerformanceCreate" }
      responses:
        { "201": { $ref: "#/components/responses/PerformanceResponse" } }
  /performances/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    put:
      tags: [Performances]
      operationId: updatePerformance
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/PerformanceUpdate" }
      responses:
        { "200": { $ref: "#/components/responses/PerformanceResponse" } }
    delete:
      tags: [Performances]
      operationId: deletePerformance
      security: [{ bearerAuth: [] }]
      responses: { "204": { description: Performance deleted } }

  /media:
    post:
      tags: [Media]
      operationId: createMedia
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/MediaCreate" }
      responses: { "201": { $ref: "#/components/responses/MediaResponse" } }
  /media/upload-url:
    post:
      tags: [Media]
      operationId: createMediaUploadUrl
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/UploadUrl" }
      responses: { "200": { $ref: "#/components/responses/UploadUrlResponse" } }
  /media/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      tags: [Media]
      operationId: getMedia
      responses: { "200": { $ref: "#/components/responses/MediaResponse" } }
    put:
      tags: [Media]
      operationId: updateMedia
      summary: Update media metadata
      description: The uploader may update their media. The owning organizer may update any media within the organization, including performer-uploaded media. Uploader attribution is immutable.
      security: [{ bearerAuth: [] }]
      requestBody: { $ref: "#/components/requestBodies/MediaUpdate" }
      responses:
        {
          "200": { $ref: "#/components/responses/MediaResponse" },
