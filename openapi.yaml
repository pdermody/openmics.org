openapi: 3.0.3
info:
  title: Open Mic API
  version: 1.0.0
  description: Canonical API contract. All paths are relative to the /api base URL.
servers:
  - url: https://api.openmics.org/api
    description: Production
tags:
  - name: Auth
  - name: Accounts
  - name: Profiles
  - name: Handles
  - name: Open Mics
  - name: Events
  - name: Registrations
  - name: Performances
  - name: Media
  - name: Admin
paths:
  /openapi.json:
    get:
      tags:
        - Auth
      operationId: getOpenApiDocument
      summary: Get the canonical OpenAPI document
      responses:
        "200":
          description: OpenAPI document
          content:
            application/json:
              schema:
                type: object
  /auth/sign-up:
    post:
      tags:
        - Auth
      operationId: signUp
      requestBody:
        $ref: "#/components/requestBodies/SignUp"
      responses:
        "202":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /auth/sign-in:
    post:
      tags:
        - Auth
      operationId: signIn
      requestBody:
        $ref: "#/components/requestBodies/SignIn"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh-token:
    post:
      tags:
        - Auth
      operationId: refreshToken
      requestBody:
        $ref: "#/components/requestBodies/RefreshToken"
      responses:
        "200":
          $ref: "#/components/responses/TokenResponse"
  /auth/profile:
    get:
      tags:
        - Auth
      operationId: getAuthProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      tags:
        - Accounts
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
  /me/permissions:
    get:
      tags:
        - Accounts
      operationId: getMyPermissions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProfileQuery"
      responses:
        "200":
          $ref: "#/components/responses/PermissionResponse"
  /accounts/{id}:
    put:
      tags:
        - Accounts
      operationId: updateAccount
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/AccountUpdate"
      responses:
        "200":
          $ref: "#/components/responses/AccountResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /accounts/{id}/profiles:
    get:
      tags:
        - Accounts
      operationId: listAccountProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/ProfileListResponse"
  /accounts/{id}/current-profile:
    put:
      tags:
        - Accounts
      operationId: setCurrentProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/CurrentProfile"
      responses:
        "200":
          $ref: "#/components/responses/ProfileResponse"
  /me/claimable-registrations:
    get:
      tags:
        - Registrations
      operationId: listClaimableRegistrations
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RegistrationListResponse"
  /profiles:
    get:
      tags:
        - Profiles
      operationId: listProfiles
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/ProfileListResponse"
    post:
      tags:
        - Profiles
      operationId: createProfile
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ProfileCreate"
      responses:
        "201":
          $ref: "#/components/responses/ProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/HandleConflict"
  /profiles/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Profiles
      operationId: getProfile
      responses:
        "200":
          $ref: "#/components/responses/ProfileResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Profiles
      operationId: deleteProfile
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Profile soft-deleted
        "403":
          $ref: "#/components/responses/Forbidden"
    patch:
      tags:
        - Profiles
      operationId: updateProfile
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/ProfileUpdate"
      responses:
        "200":
          $ref: "#/components/responses/ProfileResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "403":
          $ref: "#/components/responses/Forbidden"
  /profiles/{id}/media:
    get:
      tags:
        - Media
      operationId: listProfileMedia
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/MediaListResponse"
    post:
      tags:
        - Media
      operationId: addProfileMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/MediaCreate"
      responses:
        "201":
          $ref: "#/components/responses/MediaResponse"
  /handles/check/{candidate}:
    get:
      tags:
        - Handles
      operationId: checkHandleAvailability
      parameters:
        - $ref: "#/components/parameters/Candidate"
      responses:
        "200":
          $ref: "#/components/responses/AvailabilityResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /open-mics:
    get:
      tags:
        - Open Mics
      operationId: listOpenMics
      parameters:
        - $ref: "#/components/parameters/Q"
        - $ref: "#/components/parameters/Country"
        - $ref: "#/components/parameters/City"
        - $ref: "#/components/parameters/Activity"
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/Radius"
        - $ref: "#/components/parameters/MinRating"
        - $ref: "#/components/parameters/RegistrationMode"
        - $ref: "#/components/parameters/Sort"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          $ref: "#/components/responses/OpenMicListResponse"
    post:
      tags:
        - Open Mics
      operationId: createOpenMic
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/OpenMicCreate"
      responses:
        "201":
          $ref: "#/components/responses/OpenMicResponse"
        "409":
          $ref: "#/components/responses/HandleConflict"
  /open-mics/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Open Mics
      operationId: getOpenMic
      responses:
        "200":
          $ref: "#/components/responses/OpenMicResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Open Mics
      operationId: deleteOpenMic
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Open mic soft-deleted
    patch:
      tags:
        - Open Mics
      operationId: updateOpenMic
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/OpenMicUpdate"
      responses:
        "200":
          $ref: "#/components/responses/OpenMicResponse"
  /open-mics/{id}/events:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Events
      operationId: listOpenMicEvents
      responses:
        "200":
          $ref: "#/components/responses/EventListResponse"
    post:
      tags:
        - Events
      operationId: createEvent
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/EventCreate"
      responses:
        "201":
          $ref: "#/components/responses/EventResponse"
  /open-mics/{id}/next-event:
    get:
      tags:
        - Events
      operationId: getNextEvent
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/EventResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /events/upcoming:
    get:
      tags:
        - Events
      operationId: listUpcomingEvents
      parameters:
        - $ref: "#/components/parameters/Near"
        - $ref: "#/components/parameters/Radius"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          $ref: "#/components/responses/EventListResponse"
  /events/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Events
      operationId: getEvent
      responses:
        "200":
          $ref: "#/components/responses/EventResponse"
    put:
      tags:
        - Events
      operationId: updateEvent
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/EventUpdate"
      responses:
        "200":
          $ref: "#/components/responses/EventResponse"
    delete:
      tags:
        - Events
      operationId: deleteEvent
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Event soft-deleted
  /events/{id}/registrations:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Registrations
      operationId: listEventRegistrations
      security:
        - bearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/RegistrationListResponse"
    post:
      tags:
        - Registrations
      operationId: createRegistration
      requestBody:
        $ref: "#/components/requestBodies/RegistrationCreate"
      responses:
        "201":
          $ref: "#/components/responses/RegistrationResponse"
        "409":
          $ref: "#/components/responses/CapacityError"
        "429":
          $ref: "#/components/responses/RateLimited"
  /events/{id}/media:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Media
      operationId: listEventMedia
      parameters:
        - name: grouped_by
          in: query
          schema:
            type: string
            enum:
              - added_by_role
      responses:
        "200":
          $ref: "#/components/responses/MediaListResponse"
    post:
      tags:
        - Media
      operationId: addEventMedia
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MediaCreate"
      responses:
        "201":
          $ref: "#/components/responses/MediaResponse"
  /registrations/edit:
    get:
      tags:
        - Registrations
      operationId: resolveRegistrationEditLink
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Registration and short-lived edit session established
          headers:
            Set-Cookie:
              description: Secure, HttpOnly, SameSite=Lax edit-session cookie; raw token is
                not retained.
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: no-store
            Referrer-Policy:
              schema:
                type: string
                example: no-referrer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registration"
        "404":
          $ref: "#/components/responses/NotFound"
  /registrations/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Registrations
      operationId: getRegistration
      security:
        - bearerAuth: []
        - editSession: []
      responses:
        "200":
          $ref: "#/components/responses/RegistrationResponse"
    put:
      tags:
        - Registrations
      operationId: updateRegistration
      security:
        - bearerAuth: []
        - editSession: []
      requestBody:
        $ref: "#/components/requestBodies/RegistrationUpdate"
      responses:
        "200":
          $ref: "#/components/responses/RegistrationResponse"
  /registrations/{id}/rotate-edit-token:
    post:
      tags:
        - Registrations
      operationId: rotateRegistrationEditToken
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/RegistrationResponse"
  /registrations/{id}/verify-email:
    post:
      tags:
        - Registrations
      operationId: verifyRegistrationEmail
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/EmailVerification"
      responses:
        "200":
          $ref: "#/components/responses/RegistrationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
  /registrations/{id}/claim:
    post:
      tags:
        - Registrations
      operationId: claimRegistration
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/RegistrationClaim"
      responses:
        "200":
          $ref: "#/components/responses/RegistrationResponse"
        "409":
          $ref: "#/components/responses/ClaimConflict"
  /registrations/{id}/performances:
    get:
      tags:
        - Performances
      operationId: listRegistrationPerformances
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/PerformanceListResponse"
  /performances:
    post:
      tags:
        - Performances
      operationId: createPerformance
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/PerformanceCreate"
      responses:
        "201":
          $ref: "#/components/responses/PerformanceResponse"
  /performances/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    put:
      tags:
        - Performances
      operationId: updatePerformance
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/PerformanceUpdate"
      responses:
        "200":
          $ref: "#/components/responses/PerformanceResponse"
    delete:
      tags:
        - Performances
      operationId: deletePerformance
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Performance deleted
  /media:
    post:
      tags:
        - Media
      operationId: createMedia
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MediaCreate"
      responses:
        "201":
          $ref: "#/components/responses/MediaResponse"
  /media/upload-url:
    post:
      tags:
        - Media
      operationId: createMediaUploadUrl
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/UploadUrl"
      responses:
        "200":
          $ref: "#/components/responses/UploadUrlResponse"
  /media/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags:
        - Media
      operationId: getMedia
      responses:
        "200":
          $ref: "#/components/responses/MediaResponse"
    put:
      tags:
        - Media
      operationId: updateMedia
      summary: Update media metadata
      description: The uploader may update their media. The owning organizer may
        update any media within the organization, including performer-uploaded
        media. Uploader attribution is immutable.
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/MediaUpdate"
      responses:
        "200":
          $ref: "#/components/responses/MediaResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Media
      operationId: deleteMedia
      description: The uploader may delete their own media. The owning organizer may
        delete any media within the organization, including performer-uploaded
        media.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Media soft-deleted
  /media/{id}/recover:
    post:
      tags:
        - Media
      operationId: recoverMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          $ref: "#/components/responses/MediaResponse"
  /admin/reserved-handles:
    get:
      tags:
        - Admin
      operationId: listReservedHandles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Tag"
        - $ref: "#/components/parameters/Page"
      responses:
        "200":
          $ref: "#/components/responses/HandleListResponse"
    post:
      tags:
        - Admin
      operationId: reserveHandle
      security:
        - bearerAuth: []
      requestBody:
        $ref: "#/components/requestBodies/HandleReservation"
      responses:
        "201":
          $ref: "#/components/responses/HandleResponse"
        "409":
          $ref: "#/components/responses/HandleConflict"
  /admin/reserved-handles/{handle}:
    delete:
      tags:
        - Admin
      operationId: releaseReservedHandle
      security:
        - bearerAuth: []
      parameters:
        - name: handle
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Reservation released
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    editSession:
      type: apiKey
      in: cookie
      name: openmic_edit_session
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Candidate:
      name: candidate
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    ProfileQuery:
      name: profile
      in: query
      schema:
        type: string
        format: uuid
    Q:
      name: q
      in: query
      schema:
        type: string
    Country:
      name: country
      in: query
      schema:
        type: string
    City:
      name: city
      in: query
      schema:
        type: string
    Activity:
      name: activity
      in: query
      schema:
        $ref: "#/components/schemas/Activity"
    Tag:
      name: tag
      in: query
      schema:
        type: string
    Near:
      name: near
      in: query
      description: Latitude and longitude as `lat,lng`.
      schema:
        type: string
        pattern: ^-?[0-9.]+,-?[0-9.]+
    Radius:
      name: radius_km
      in: query
      schema:
        type: number
        minimum: 0
    MinRating:
      name: min_rating
      in: query
      schema:
        type: number
        minimum: 0
        maximum: 5
    RegistrationMode:
      name: registration_mode
      in: query
      schema:
        $ref: "#/components/schemas/RegistrationMode"
    Sort:
      name: sort
      in: query
      schema:
        type: string
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    From:
      name: from
      in: query
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      schema:
        type: string
        format: date-time
  requestBodies:
    SignUp:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignUpRequest"
    SignIn:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SignInRequest"
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RefreshTokenRequest"
    AccountUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AccountUpdateRequest"
    CurrentProfile:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CurrentProfileRequest"
    ProfileCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileCreateRequest"
    ProfileUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProfileUpdateRequest"
    OpenMicCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenMicCreateRequest"
    OpenMicUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenMicUpdateRequest"
    EventCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventCreateRequest"
    EventUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EventUpdateRequest"
    RegistrationCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationCreateRequest"
    RegistrationUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationUpdateRequest"
    RegistrationClaim:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RegistrationClaimRequest"
    EmailVerification:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmailVerificationRequest"
    PerformanceCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PerformanceCreateRequest"
    PerformanceUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PerformanceUpdateRequest"
    MediaCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MediaCreateRequest"
    MediaUpdate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MediaUpdateRequest"
    UploadUrl:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UploadUrlRequest"
    HandleReservation:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HandleReservationRequest"
  responses:
    AccountResponse:
      description: Account
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Account"
    ProfileResponse:
      description: Profile
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Profile"
    OpenMicResponse:
      description: Open mic
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenMic"
    EventResponse:
      description: Event
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Event"
    RegistrationResponse:
      description: Registration
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Registration"
    PerformanceResponse:
      description: Performance
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Performance"
    MediaResponse:
      description: Media
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Media"
    HandleResponse:
      description: Handle
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Handle"
    PermissionResponse:
      description: Permissions
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionSet"
    AvailabilityResponse:
      description: Availability
      content:
        application/json:
          schema:
