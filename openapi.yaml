          description: Part of the location snapshot. If provided, all location fields
            (venue_name, address_line1, city, country, lat, lng) must be
            provided together. If omitted, event inherits location from parent
            open mic.
        address_line1:
          type: string
        address_line2:
          type: string
        postcode:
          type: string
        city:
          type: string
        country:
          type: string
        lat:
          type: number
          minimum: -90
          maximum: 90
        lng:
          type: number
          minimum: -180
          maximum: 180
        activities:
          type: array
          items:
            $ref: "#/components/schemas/Activity"
        tags:
          type: array
          items:
            type: string
        notes:
          type: string
        entry_fee_amount:
          type: number
          minimum: 0
        entry_fee_currency:
          type: string
        entry_fee_note:
          type: string
    RegistrationCreateRequest:
      type: object
      required:
        - performer_name
        - submission_channel
        - organizer_supervised
      properties:
        profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          description: Required for authenticated self-serve registrations; must reference
            a separate account-owned profile with profile_kind=performer.
        performer_name:
          type: string
        performer_city:
          type: string
        contact_email:
          type: string
          format: email
        contact_phone:
          type: string
        song_names:
          type: array
          items:
            type: string
        submission_channel:
          $ref: "#/components/schemas/RegistrationChannel"
        organizer_supervised:
          type: boolean
        referred_by_profile_id:
          $ref: "#/components/schemas/Id"
        media_consent:
          type: boolean
    RegistrationUpdateRequest:
      type: object
      properties:
        performer_name:
          type: string
        performer_city:
          type: string
        song_names:
          type: array
          items:
            type: string
        media_consent:
          type: boolean
        adopted_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
          description: Registration owner may change or clear the adopted public
            attribution after the initial claim.
    RegistrationClaimRequest:
      type: object
      properties:
        adopted_profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
          description: An account-owned performer profile to adopt as the public
            attribution for this registration. Omit or set null to claim without
            adopting a public profile.
        sync_public_fields:
          type: boolean
          description: If true and adopted_profile_id is set, update performer_name and
            performer_city from the adopted profile for public event
            attribution.
        note:
          type: string
          nullable: true
    EmailVerificationRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
    PerformanceCreateRequest:
      type: object
      required:
        - registration_id
        - name
      properties:
        registration_id:
          $ref: "#/components/schemas/Id"
        name:
          type: string
        activity:
          $ref: "#/components/schemas/Activity"
        sequence:
          type: integer
    PerformanceUpdateRequest:
      $ref: "#/components/schemas/PerformanceCreateRequest"
    MediaCreateRequest:
      type: object
      required:
        - media_type
        - source_url
      properties:
        media_type:
          $ref: "#/components/schemas/MediaType"
        source_url:
          type: string
          format: uri
          description: For media_type=photo, an object URL in the platform's own S3 media
            bucket (via the upload-url flow). For media_type=video, a link on an
            allowlisted host (youtube.com, youtu.be, or vimeo.com). Enforced
            server-side; arbitrary hosts are rejected.
        caption:
          type: string
        event_id:
          $ref: "#/components/schemas/Id"
        profile_owner_id:
          $ref: "#/components/schemas/Id"
    MediaUpdateRequest:
      type: object
      properties:
        caption:
          type: string
        source_url:
          type: string
          format: uri
          description: Subject to the same host-allowlist policy as
            MediaCreateRequest.source_url.
        profile_owner_id:
          $ref: "#/components/schemas/Id"
    UploadUrlRequest:
      type: object
      required:
        - media_type
        - mime_type
      properties:
        media_type:
          $ref: "#/components/schemas/MediaType"
        mime_type:
          type: string
        size_bytes:
          type: integer
    HandleReservationRequest:
      type: object
      required:
        - handle
        - category
        - reason
      properties:
        handle:
          type: string
        category:
          type: string
        reason:
          type: string
