  schemas:
    Id: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    Activity:
      {
        type: string,
        enum: [singing, poetry, jam, trad, comedy, storytelling, other],
      }
    ProfileVisibility: { type: string, enum: [public, unlisted, private] }
    OpenMicStatus: { type: string, enum: [active, paused, ended, draft] }
    RegistrationMode:
      { type: string, enum: [pre_only, on_night_only, both, external] }
    RegistrationChannel:
      {
        type: string,
        enum:
          [
            organic,
            shared_link,
            email_reminder,
            social_ad,
            poster_qr,
            kiosk,
            prior,
          ],
      }
    RegistrationVisibility: { type: string, enum: [pending, valid] }
    MediaType: { type: string, enum: [photo, video] }
    RoleName:
      { type: string, enum: [Owner, Admin, Assistant, Performer, Organizer] }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              {
                type: array,
                items: { type: object, additionalProperties: true },
              }
    HandleConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
        - type: object
          properties:
            holder_type:
              { type: string, enum: [profile, open_mic], nullable: true }
            holder_id:
              { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
    Account:
      type: object
      required: [id, email, display_name, plan, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        cognito_id: { type: string }
        email: { type: string, format: email }
        display_name: { type: string }
        city: { type: string, nullable: true }
        preferred_language: { type: string, nullable: true }
        current_profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        is_platform_admin: { type: boolean }
        plan: { type: string, enum: [free, pro] }
        referred_by_profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        referred_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Profile:
      type: object
      required:
        [id, created_by_account_id, profile_name, visibility, current_handle]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        created_by_account_id: { $ref: "#/components/schemas/Id" }
        current_handle: { type: string }
        slug: { type: string, deprecated: true }
        profile_name: { type: string }
        profile_kind: { type: string, enum: [organizer, performer] }
        bio: { type: string, nullable: true }
        profile_image_url: { type: string, format: uri, nullable: true }
        theme_name: { type: string, nullable: true }
        visibility: { $ref: "#/components/schemas/ProfileVisibility" }
        links:
          { type: array, items: { $ref: "#/components/schemas/ProfileLink" } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        deleted_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        recovery_deadline:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
    ProfileLink:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profile_id: { $ref: "#/components/schemas/Id" }
        type:
          {
            type: string,
            enum:
              [
                website,
                instagram,
                youtube,
                tiktok,
                twitter,
                facebook,
                spotify,
                bandcamp,
                email,
                phone,
                other,
              ],
          }
        url: { type: string }
        label: { type: string, nullable: true }
        sequence: { type: integer }
    OpenMic:
      type: object
      required: [id, current_handle, name, status]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        owner_profile_id: { $ref: "#/components/schemas/Id" }
        current_handle: { type: string }
        slug: { type: string, deprecated: true }
        name: { type: string }
        description: { type: string, nullable: true }
        activities:
          { type: array, items: { $ref: "#/components/schemas/Activity" } }
        tags: { type: array, items: { type: string } }
        venue_name: { type: string }
        address_line1: { type: string }
        address_line2: { type: string, nullable: true }
        postcode: { type: string, nullable: true }
        city: { type: string }
        country: { type: string }
        lat: { type: number, minimum: -90, maximum: 90, nullable: true }
        lng: { type: number, minimum: -180, maximum: 180, nullable: true }
        time_zone: { type: string, example: Europe/Dublin }
        schedule_summary: { type: string, nullable: true }
        schedule_details: { type: string, nullable: true }
        website: { type: string, format: uri, nullable: true }
        contact_email: { type: string, format: email, nullable: true }
        originals_only: { type: boolean }
        amplification_available: { type: boolean }
        registration_mode: { $ref: "#/components/schemas/RegistrationMode" }
        external_registration_url: { type: string, format: uri, nullable: true }
        entry_fee_amount: { type: number, nullable: true }
        entry_fee_currency: { type: string, nullable: true }
        entry_fee_note: { type: string, nullable: true }
        status: { $ref: "#/components/schemas/OpenMicStatus" }
        rating_avg: { type: number, minimum: 0, maximum: 5 }
        rating_count: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Event:
      type: object
      required: [id, open_mic_id, title, starts_at, time_zone]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        open_mic_id: { $ref: "#/components/schemas/Id" }
        slug: { type: string }
        title: { type: string }
        starts_at: { $ref: "#/components/schemas/Timestamp" }
        ends_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        time_zone: { type: string, example: Europe/Dublin }
        running: { type: boolean, nullable: true }
        registrations_closed_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        venue_name: { type: string }
        address_line1: { type: string }
        address_line2: { type: string, nullable: true }
        postcode: { type: string, nullable: true }
        city: { type: string }
        country: { type: string }
        lat: { type: number, minimum: -90, maximum: 90, nullable: true }
        lng: { type: number, minimum: -180, maximum: 180, nullable: true }
        activities:
          { type: array, items: { $ref: "#/components/schemas/Activity" } }
        tags: { type: array, items: { type: string } }
        capacity: { type: integer, minimum: 1, nullable: true }
        notes: { type: string, nullable: true }
        rating_avg: { type: number, minimum: 0, maximum: 5, nullable: true }
        rating_count: { type: integer, minimum: 0 }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Registration:
      type: object
      required:
        [
          id,
          event_id,
          performer_name,
          submission_channel,
          organizer_supervised,
          visibility_state,
        ]
      properties:
        id: { $ref: "#/components/schemas/Id" }
        event_id: { $ref: "#/components/schemas/Id" }
        profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        performer_name: { type: string }
        performer_city: { type: string, nullable: true }
        contact_email: { type: string, format: email, nullable: true }
        contact_phone: { type: string, nullable: true }
        song_names: { type: array, items: { type: string } }
        submission_channel: { $ref: "#/components/schemas/RegistrationChannel" }
        organizer_supervised: { type: boolean }
        referred_by_profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        media_consent: { type: boolean }
        email_verified_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        verification_method:
          {
            type: string,
            enum: [email, organizer_kiosk, authenticated_account],
            nullable: true,
          }
        visibility_state:
          { $ref: "#/components/schemas/RegistrationVisibility" }
        claimed_by_account_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        claimed_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Performance:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        registration_id: { $ref: "#/components/schemas/Id" }
        name: { type: string }
        activity: { $ref: "#/components/schemas/Activity" }
        sequence: { type: integer, minimum: 1 }
        status: { type: string, enum: [planned, performed, cancelled] }
        notes: { type: string, nullable: true }
    Media:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        media_type: { $ref: "#/components/schemas/MediaType" }
        event_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        profile_owner_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        added_by_profile_id: { $ref: "#/components/schemas/Id" }
        added_by_role: { type: string, enum: [performer, organizer] }
        source_url: { type: string, format: uri }
        mime_type: { type: string, nullable: true }
        size_bytes: { type: integer, nullable: true }
        caption: { type: string, nullable: true }
        thumbnail_url: { type: string, format: uri, nullable: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Comment:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profile_id: { $ref: "#/components/schemas/Id" }
        text: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5, nullable: true }
        target: { $ref: "#/components/schemas/CommentTarget" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    CommentTarget:
      type: object
      required: [type, id]
      properties:
        type:
          {
            type: string,
            enum:
              [media, comment, event, open_mic, private_message, suggestion],
          }
        id: { $ref: "#/components/schemas/Id" }
    Reaction:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        profile_id: { $ref: "#/components/schemas/Id" }
        type: { type: string, enum: [like, upvote] }
        target: { $ref: "#/components/schemas/ReactionTarget" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    ReactionTarget:
      type: object
      required: [type, id]
      properties:
        type:
          { type: string, enum: [media, comment, private_message, suggestion] }
        id: { $ref: "#/components/schemas/Id" }
    Review:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        event_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        open_mic_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        profile_id: { $ref: "#/components/schemas/Id" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        text: { type: string, nullable: true }
        response: { type: string, nullable: true }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    PrivateMessage:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        sender_profile_id: { $ref: "#/components/schemas/Id" }
        receiver_profile_id: { $ref: "#/components/schemas/Id" }
        text: { type: string }
        read_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Suggestion:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        account_id: { $ref: "#/components/schemas/Id" }
        title: { type: string }
        body: { type: string }
        status:
          {
            type: string,
            enum: [open, planned, in_progress, completed, declined],
          }
        admin_notes: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        created_at: { $ref: "#/components/schemas/Timestamp" }
        updated_at: { $ref: "#/components/schemas/Timestamp" }
    Notification:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        recipient_profile_id: { $ref: "#/components/schemas/Id" }
        type:
          {
            type: string,
            enum:
              [
                private_message,
                comment,
                reply,
                reaction,
                review,
                review_response,
              ],
          }
        actor_profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        entity_type: { type: string }
        entity_id: { $ref: "#/components/schemas/Id" }
        preview: { type: string, nullable: true }
        read_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        email_required: { type: boolean }
        email_sent_at:
          {
            allOf: [{ $ref: "#/components/schemas/Timestamp" }],
            nullable: true,
          }
        created_at: { $ref: "#/components/schemas/Timestamp" }
    Handle:
      type: object
      properties:
        handle: { type: string }
        entity_type: { type: string, enum: [profile, open_mic], nullable: true }
        profile_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        open_mic_id:
          { allOf: [{ $ref: "#/components/schemas/Id" }], nullable: true }
        status: { type: string, enum: [current, retired, reserved, tombstoned] }
        redirects_to_handle: { type: string, nullable: true }
        reserved_category: { type: string, nullable: true }
        reserved_reason: { type: string, nullable: true }
    Role:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        name: { $ref: "#/components/schemas/RoleName" }
        description: { type: string }
    Permission:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        key: { type: string }
        description: { type: string }
    AccountProfileRole:
      type: object
      properties:
        id: { $ref: "#/components/schemas/Id" }
        account_id: { $ref: "#/components/schemas/Id" }
        profile_id: { $ref: "#/components/schemas/Id" }
        role_id: { $ref: "#/components/schemas/Id" }
