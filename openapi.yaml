          $ref: "#/components/schemas/Id"
        profile_id:
          allOf:
            - $ref: "#/components/schemas/Id"
          nullable: true
        performer_name:
          type: string
        performer_city:
          type: string
          nullable: true
        contact_email:
          type: string
          format: email
          nullable: true
        contact_phone:
          type: string
          nullable: true
        song_names:
          type: array
          items:
            type: string
