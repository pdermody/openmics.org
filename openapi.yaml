components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
    editSession:
      type: apiKey
      in: cookie
      name: openmic_edit_session
  parameters:
    Id:
      {
        name: id,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    AccountId:
      {
        name: accountId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ProfileId:
      {
        name: profileId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    ReviewId:
      {
        name: reviewId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    PermissionId:
      {
        name: permissionId,
        in: path,
        required: true,
        schema: { type: string, format: uuid },
      }
    Candidate:
      {
        name: candidate,
        in: path,
        required: true,
        schema: { type: string, minLength: 1 },
      }
    Slug: { name: slug, in: query, required: true, schema: { type: string } }
    ProfileQuery:
      { name: profile, in: query, schema: { type: string, format: uuid } }
    Q: { name: q, in: query, schema: { type: string } }
    Country: { name: country, in: query, schema: { type: string } }
    City: { name: city, in: query, schema: { type: string } }
    Activity:
      {
        name: activity,
        in: query,
        schema: { $ref: "#/components/schemas/Activity" },
      }
    Tag: { name: tag, in: query, schema: { type: string } }
    Near:
      name: near
      in: query
      description: Latitude and longitude as `lat,lng`.
      schema:
        type: string
        pattern: "^-?[0-9.]+,-?[0-9.]+"
    Radius: { name: radius_km, in: query, schema: { type: number, minimum: 0 } }
    MinRating:
      {
        name: min_rating,
        in: query,
        schema: { type: number, minimum: 0, maximum: 5 },
      }
    RegistrationMode:
      {
        name: registration_mode,
        in: query,
        schema: { $ref: "#/components/schemas/RegistrationMode" },
      }
    Sort: { name: sort, in: query, schema: { type: string } }
    Page:
      {
        name: page,
        in: query,
        schema: { type: integer, minimum: 1, default: 1 },
      }
    PageSize:
      {
        name: page_size,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
      }
    Limit:
      {
        name: limit,
        in: query,
        schema: { type: integer, minimum: 1, maximum: 100, default: 25 },
      }
    From: { name: from, in: query, schema: { type: string, format: date-time } }
    To: { name: to, in: query, schema: { type: string, format: date-time } }
    Bbox:
      name: bbox
      in: query
      description: west,south,east,north.
      schema:
        type: string
    Zoom:
      {
        name: zoom,
        in: query,
        schema: { type: integer, minimum: 0, maximum: 22 },
      }
    Status: { name: status, in: query, schema: { type: string } }
  requestBodies:
    SignUp:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SignUpRequest" } },
          },
      }
    SignIn:
      {
        required: true,
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/SignInRequest" } },
          },
      }
    RefreshToken:
