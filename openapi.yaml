      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                additionalProperties: true
    HandleConflictError:
      allOf:
        - $ref: "#/components/schemas/ErrorEnvelope"
