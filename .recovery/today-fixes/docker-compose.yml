services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: openmic_dev
      POSTGRES_USER: openmic
      POSTGRES_PASSWORD: openmic_local
    ports:
      - '5432:5432'
    volumes:
      - openmic-postgres:/var/lib/postgresql/data

  # Local S3/SQS emulation for the media pipeline (media-gallery-plan.md). Lets the real
  # S3 storage adapter (MEDIA_STORAGE_ADAPTER=s3) run end-to-end locally: bucket, CORS,
  # public-read policy and the renditions queue are provisioned by the init hook mounted
  # below. Presigned URLs use the public wildcard DNS *.localhost.localstack.cloud, which
  # resolves to 127.0.0.1 — required because the AWS SDK presigns virtual-hosted-style URLs.
  localstack:
    image: localstack/localstack:4
    environment:
      SERVICES: s3,sqs
    ports:
      - '4566:4566'
    volumes:
      - ./scripts/localstack:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  openmic-postgres: